site_name: Hephaistos
site_description: Armory-first study CLI
site_url: https://gildrb.github.io/hephaistos
repo_url: https://github.com/gildrb/hephaistos
repo_name: gildrb/hephaistos
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: amber
      accent: deep-orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: deep-orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Architecture: architecture.md
  - CLI Reference: cli-reference.md
  - API Reference:
    - app: api/app.md
    - armory: api/armory.md
    - chat: api/chat.md
    - agent: api/agent.md
    - rag: api/rag.md
    - materials: api/materials.md
    - memory: api/memory.md
    - parameters: api/parameters.md
    - providers: api/providers.md
    - source (compatibility): api/source.md
    - study: api/study.md
  - Changelog: changelog.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [hephaistos]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_category_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
