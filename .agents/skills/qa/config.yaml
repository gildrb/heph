project: Hephaistos
imagemagick: true
environments:
  local:
    url: "local"
    restrictions: []

default_target: local

auth:
  method: oauth-or-api-key
  provider: openai-codex
  fallback_providers:
    - openrouter
    - custom
    - pollinations

personas:
  - name: first_time_user
    description: "Fresh install, no config, no API key, no armory"
    email: null
    credentials_source: none
    test_focus:
      - launch TUI without config
      - armory browser empty state
      - /help and /status with no provider
      - autocomplete suggestions
    cannot_do:
      - send chat messages (no API key)
      - run /vocab or /study (no armory)

  - name: configured_user
    description: "Has ChatGPT/OpenAI Codex subscription or compatible provider configured, no armory attached"
    email: null
    credentials_source: oauth-or-env-var
    secret_name: OPENAI_API_KEY
    test_focus:
      - no-armory chat guidance
      - /login and /models provider/model selection
      - /new and /export
      - settings and command surface
    cannot_do:
      - run /vocab or /study (no armory)
      - use source-retrieval features

  - name: armory_user
    description: "Has ChatGPT/OpenAI Codex subscription or compatible provider + armory with materials attached"
    email: null
    credentials_source: oauth-or-env-var
    secret_name: OPENAI_API_KEY
    test_focus:
      - armory-attached status display
      - source-informed chat responses
      - /vocab and /study commands
      - /sessions save and resume
      - /stats and /usage
    cannot_do: []

apps:
  cli:
    path_patterns:
      - "hephaistos/**"
      - "tests/**"
    skill: qa-cli
    test_tool: tuistory
    build_command: "uv sync --frozen"
    launch_command: "uv run heph"

feature_flags:
  provider: none
  dashboard_url: null
  how_to_override: "Set HEPHAISTOS_FEATURE_FLAGS env var (comma-separated)"

integrations:
  llm:
    provider: openai-codex
    endpoint: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY
    default_model: gpt-5.4-mini
    auth_priority:
      - hephaistos_openai_codex_oauth
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - custom_openai_compatible
      - pollinations_keyless_smoke_only
  memory:
    provider: supermemory
    api_key_env: SUPERMEMORY_API_KEY
    optional: true
  telemetry:
    analytics: posthog
    crash_reports: sentry
    opt_in: true

cleanup:
  auto_cleanup: true
  strategy: delete-test-armories
  instructions: >
    Remove only the named QA armory directory created during testing under
    ~/.armories/. Preserve all pre-existing user armories. Preserve
    ~/.config/hephaistos/providers.toml, ~/.config/hephaistos/config.json, and
    ~/.config/hephaistos/auth.json unless the test created a temporary file and
    recorded that it did not exist before. Never run /logout all or clear the
    user's pre-existing provider credentials during QA.

failure_learning: suggest_in_report
