repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        name: check-large-files
        args: [--maxkb=500]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sync-docs
        name: sync-docs (README/docs/AGENTS)
        language: system
        entry: uv run python -m scripts.sync_docs
        pass_filenames: false
        always_run: true
      - id: check-repo-policies
        name: repo-policies (no Any / no deferred imports)
        language: python
        entry: python -m scripts.check_repo_policies
        types: [python]
        pass_filenames: false
      - id: check-lockfile-change
        name: lockfile change review gate
        language: python
        entry: python -m scripts.check_lockfile_change
        files: ^uv\.lock$
      - id: check-dependency-pinning
        name: dependency pinning
        language: python
        entry: python -m scripts.check_dependency_pinning
        files: ^pyproject\.toml$
        pass_filenames: false
      - id: check-sdist-allowlist
        name: source-only sdist allowlist
        language: python
        entry: python -m scripts.check_dependency_sdist_allowlist
        files: ^uv\.lock$
        pass_filenames: false
      - id: ty
        name: ty (type-check)
        language: system
        entry: uv run ty check
        types: [python]
        pass_filenames: false
      - id: vulture
        name: vulture (dead-code)
        language: python
        entry: uv run vulture hephaion tests vulture-whitelist.py
        types: [python]
        pass_filenames: false
      - id: pylint-duplicate-code
        name: pylint (duplicate-code)
        language: python
        entry: uv run pylint --persistent=no --score=no --disable=all --enable=duplicate-code hephaion
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: import-linter (architecture)
        language: python
        entry: uv run lint-imports
        types: [python]
        pass_filenames: false
      - id: check-architecture-guardrails
        name: architecture guardrails
        language: python
        entry: uv run python scripts/check_architecture_guardrails.py
        types: [python]
        pass_filenames: false
      - id: deptry
        name: deptry (unused-deps)
        language: python
        entry: uv run deptry hephaion
        types: [python]
        pass_filenames: false
      - id: radon-complexity
        name: radon (complexity)
        language: python
        entry: uv run radon cc hephaion -a -nc
        types: [python]
        pass_filenames: false
      - id: check-tech-debt
        name: tech-debt (TODO/FIXME issue links)
        language: python
        entry: python scripts/check_tech_debt.py --strict
        types: [python]
        pass_filenames: false
      - id: validate-agents-md
        name: validate-agents-md (AGENTS.md commands)
        language: python
        entry: python scripts/validate_agents_md.py --strict
        files: AGENTS\.md$
        pass_filenames: false
