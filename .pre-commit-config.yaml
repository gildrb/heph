repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/ComPWA/tap-pre-commit
    rev: v0.3.0
    hooks:
      - id: mypy
        name: basedpyright (type-check)
        language: python
        entry: basedpyright
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        name: check-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: vulture
        name: vulture (dead-code)
        language: python
        entry: vulture hephaistos tests vulture-whitelist.py
        types: [python]
        pass_filenames: false
      - id: pylint-duplicate-code
        name: pylint (duplicate-code)
        language: python
        entry: pylint --disable=all --enable=duplicate-code hephaistos
        types: [python]
        pass_filenames: false
