repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/ComPWA/tap-pre-commit
    rev: v0.3.0
    hooks:
      - id: mypy
        name: basedpyright (type-check)
        language: python
        entry: basedpyright
        types: [python]
        pass_filenames: false
