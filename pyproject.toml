[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.8"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/ai", "packages/harness", "packages/heph", "packages/interfaces"]

[tool.uv.sources]
heph = { workspace = true }
heph-ai = { workspace = true }
harness = { workspace = true }
heph-interfaces = { workspace = true }

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/test"]
addopts = "-q"
