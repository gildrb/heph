[project]
name = "hephaistos"
version = "0.1.0"
description = "Armory-first study CLI"
readme = "README.md"
authors = [
    { name = "Gil", email = "hi@gildrb.com" }
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "openai>=1.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.0.0",
]

[project.scripts]
hephaistos = "hephaistos.app.cli:main"
heph = "hephaistos.app.cli:main"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"hephaistos/providers/registry.py" = ["E501"]  # model data definitions are inherently long

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
rag = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.0.0",
]
