[project]
name = "hephaistos"
version = "0.1.0"
description = "Armory-first study CLI"
readme = "README.md"
authors = [
    { name = "Gil", email = "hi@gildrb.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
hephaistos = "hephaistos.app.cli:main"
heph = "hephaistos.app.cli:main"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]
