[project]
name = "hephaistos"
version = "0.1.0"
description = "Local-first study agent for your files and any LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gil", email = "hi@gildrb.com" }
]
requires-python = ">=3.13"
keywords = ["cli", "education", "llm", "rag", "study"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "keyring>=25.7.0",
    "openai>=1.0.0",
    "rich>=14.0.0",
    "certifi>=2024.0.0",
    "supermemory>=3.0.0",
    "textual>=6.0.0",
    "docling>=2.0.0",
    "unicodeit>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/gildrb/hephaistos"
Repository = "https://github.com/gildrb/hephaistos"
Issues = "https://github.com/gildrb/hephaistos/issues"
Changelog = "https://github.com/gildrb/hephaistos/blob/main/CHANGELOG.md"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.0.0",
]
docling = []
rag = [
    "pathspec>=0.12.0",
]
fuzzy = [
    "rapidfuzz>=3.14.0",
]

[project.scripts]
hephaistos = "hephaistos.cli.main:main"
heph = "hephaistos.cli.main:main"

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "A",    # flake8-builtins (shadowing)
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "R",    # refactor
    "RET",  # flake8-return
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "ERA",  # eradicate (commented-out code)
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FURB", # refurb
    "PERF", # perflint
    "N",    # naming conventions
]
ignore = [
    "PLR0913",  # too many arguments (fine for config/data classes)
    "PLR2004",  # magic numbers (tests are full of them)
    "TD002",    # missing author in TODO
    "TD003",    # missing issue link in TODO
    "FIX002",   # TODO in code (we use them)
    "ERA001",   # commented-out code (too aggressive in tests)
    "TRY003",   # long exception messages (fine for user-facing errors)
    "EM101",    # exception must not use string literals
    "EM102",    # exception must not use f-strings
    "TC001",    # MOVE type-only imports into type-checking block
    "TC002",    # MOVE type-only imports into type-checking block
    "TC003",    # MOVE type-only imports into type-checking block
    "ARG001",   # unused method argument (required by protocol/base class)
    "ARG002",   # unused method argument (required by protocol/base class)
    "ARG005",   # unused lambda argument
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLW2901",  # overwritten loop variable
    "TRY300",   # try body should not contain return
    "TRY301",   # raise within try block
    "PLC0415",  # deferred imports are controlled by scripts/check_repo_policies
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"hephaistos/providers/oauth.py" = ["N802"]  # HTTP handler method names are stdlib-defined
"hephaistos/providers/registry.py" = ["E501"]  # model data definitions are inherently long
"scripts/check_repo_policies.py" = ["N802"]  # visit_* methods required by AST visitor pattern
"vulture-whitelist.py" = ["E501", "B018", "F821"]  # bare names are intentional vulture hints

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"
mark-parentheses = false
raises-require-match-for = ["Exception", "ValueError", "TypeError", "RuntimeError", "OSError"]

[tool.uv.build-backend]
module-root = ""

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["hephaistos", "tests"]
exclude = ["vulture-whitelist.py", ".venv"]

[tool.ty.rules]
all = "error"
unresolved-import = "ignore"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 8

[tool.pylint.main]
persistent = false
ignore-paths = []

[tool.pylint.reports]
score = false

[tool.vulture]
min_confidence = 80
paths = ["hephaistos", "tests", "vulture-whitelist.py"]

[tool.bandit]
severity = "low"
confidence = "low"
exclude_dirs = ["tests"]
skips = ["B101", "B311", "B105", "B106", "B404", "B603", "B606"]

[tool.importlinter]
root_packages = ["hephaistos"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "logging must not import adapters"
type = "forbidden"
source_modules = ["hephaistos.logging"]
forbidden_modules = [
    "hephaistos.cli",
    "hephaistos.commands",
    "hephaistos.tui",
]

[[tool.importlinter.contracts]]
name = "reusable packages must not import adapters"
type = "forbidden"
source_modules = [
    "hephaistos.chat",
    "hephaistos.agent",
    "hephaistos.rag",
    "hephaistos.providers",
    "hephaistos.armory",
    "hephaistos.study",
    "hephaistos.memory",
    "hephaistos.materials",
    "hephaistos.parameters",
    "hephaistos.source",
    "hephaistos.runtime",
    "hephaistos.logging",
    "hephaistos.terminal.palette",
    "hephaistos.matching",
    "hephaistos.privacy",
    "hephaistos.diagnostics",
    "hephaistos.vocab",
]
forbidden_modules = [
    "hephaistos.cli",
    "hephaistos.commands",
    "hephaistos.shell",
    "hephaistos.terminal.banner",
    "hephaistos.terminal.display",
    "hephaistos.terminal.history",
    "hephaistos.terminal.input",
    "hephaistos.tui",
]

[[tool.importlinter.contracts]]
name = "materials must not import adapters, chat, agent, or rag"
type = "forbidden"
source_modules = ["hephaistos.materials"]
forbidden_modules = [
    "hephaistos.tui",
    "hephaistos.chat",
    "hephaistos.agent",
    "hephaistos.rag",
    "hephaistos.study",
]

[[tool.importlinter.contracts]]
name = "rag must not import agent, chat, or adapters"
type = "forbidden"
source_modules = ["hephaistos.rag"]
forbidden_modules = [
    "hephaistos.agent",
    "hephaistos.chat",
    "hephaistos.tui",
    "hephaistos.study",
]

[[tool.importlinter.contracts]]
name = "runtime must stay below product workflows"
type = "forbidden"
source_modules = ["hephaistos.runtime"]
forbidden_modules = [
    "hephaistos.tui",
    "hephaistos.chat",
    "hephaistos.agent",
    "hephaistos.rag",
    "hephaistos.study",
    "hephaistos.materials",
    "hephaistos.memory",
    "hephaistos.armory",
]

[[tool.importlinter.contracts]]
name = "providers must stay below product workflows"
type = "forbidden"
source_modules = ["hephaistos.providers"]
forbidden_modules = [
    "hephaistos.tui",
    "hephaistos.chat",
    "hephaistos.agent",
    "hephaistos.rag",
    "hephaistos.runtime",
    "hephaistos.study",
    "hephaistos.materials",
]

[[tool.importlinter.contracts]]
name = "memory must not import adapters, chat, or agent"
type = "forbidden"
source_modules = ["hephaistos.memory"]
forbidden_modules = ["hephaistos.tui", "hephaistos.chat", "hephaistos.agent"]

[[tool.importlinter.contracts]]
name = "study must remain a pure controller layer"
type = "forbidden"
source_modules = ["hephaistos.study"]
forbidden_modules = [
    "hephaistos.tui",
    "hephaistos.chat",
    "hephaistos.agent",
    "hephaistos.rag",
]

[[tool.importlinter.contracts]]
name = "agent must not import chat.session"
type = "forbidden"
source_modules = ["hephaistos.agent"]
forbidden_modules = ["hephaistos.chat.session"]

[[tool.importlinter.contracts]]
name = "chat.session and chat.orchestrator are independent (no runtime imports)"
type = "independence"
modules = ["hephaistos.chat.session", "hephaistos.chat.orchestrator"]
ignore_imports = ["hephaistos.chat.session -> hephaistos.chat.orchestrator"]

[[tool.importlinter.contracts]]
name = "diagnostics must not import adapters"
type = "forbidden"
source_modules = ["hephaistos.diagnostics"]
forbidden_modules = [
    "hephaistos.cli",
    "hephaistos.commands",
    "hephaistos.tui",
]

[[tool.importlinter.contracts]]
name = "commands must not import workspace"
type = "forbidden"
source_modules = ["hephaistos.commands"]
forbidden_modules = []

[[tool.importlinter.contracts]]
name = "commands must not import tui"
type = "forbidden"
source_modules = ["hephaistos.commands"]
forbidden_modules = ["hephaistos.tui"]

[tool.deptry]
extend_exclude = ["tests"]
# Optional RAG/docling deps are imported conditionally at runtime;
# deptry's DEP002 (unused) flags them because it can't see conditional paths.
# DEP003 on "hephaistos" is a false positive — the project imports its own subpackages.
# DEP003 on "certifi" — imported directly in oauth.py SSL fallback; declared as a
# direct dependency so deptry should not flag it as merely transitive.
# DEP001 on nltk/numpy/sklearn — transitive deps of optional RAG extras.
# DEP004 on bm25s — optional runtime RAG backend installed through the rag group.
per_rule_ignores = { DEP002 = ["sentence-transformers", "scikit-learn", "docling", "py-spy", "pathspec", "rapidfuzz"], DEP003 = ["hephaistos", "certifi"], DEP001 = ["nltk", "numpy", "sklearn"], DEP004 = ["bm25s", "pathspec", "rapidfuzz"] }

[tool.pytest.ini_options]
addopts = "--tb=short -q --durations=10 --strict-markers -n auto --dist worksteal --cov=hephaistos --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "flaky(reruns=2, reruns_delay=1): mark test as flaky — rerun on failure",
]

# Actual coverage: 77%; threshold set to 75% to buffer against flaky variations.
[tool.coverage.report]
fail_under = 75

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "deptry>=0.22",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=0.1",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=0.1",
    "pylint>=3.0",
    "radon>=6.0",
    "ruff>=0.15.8",
    "vulture>=2.0",
    "import-linter>=2.11",
    "py-spy>=0.4",
    "bandit>=1.9",
    "ty>=0.0.34",
    "pre-commit>=4.6.0",
]
rag = [
    "bm25s>=0.2.13",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.0.0",
]
docling = []
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-autorefs>=1.2.0",
]
