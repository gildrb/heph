[project]
name = "heph"
version = "0.1.0"
description = "Local-first document workspace for grounded answers, citations, memory, and recall practice with any LLM"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Gil", email = "hi@gildrb.com" }
]
requires-python = ">=3.13"
keywords = ["cli", "documents", "llm", "rag", "retrieval", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "keyring==25.7.0",
    "openai==2.24.0",
    "rich==14.3.3",
    "certifi==2026.2.25",
    "textual==8.2.4",
]

[project.urls]
Homepage = "https://github.com/gildrb/heph"
Repository = "https://github.com/gildrb/heph"
Issues = "https://github.com/gildrb/heph/issues"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers==5.3.0",
    "scikit-learn==1.8.0",
]
docling = [
    "docling==2.86.0",
]
rag = [
    "pathspec==1.0.4",
    "tiktoken==0.13.0",
]
fuzzy = [
    "rapidfuzz==3.14.5",
]
beir = [
    "beir==2.2.0",
]
visualization = [
    "matplotlib==3.10.9",
]

[project.scripts]
hephaion = "hephaion.cli.main:main"
heph = "hephaion.cli.main:main"

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "A",    # flake8-builtins (shadowing)
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "R",    # refactor
    "RET",  # flake8-return
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "ERA",  # eradicate (commented-out code)
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FURB", # refurb
    "PERF", # perflint
    "N",    # naming conventions
]
ignore = [
    "PLR0913",  # too many arguments (fine for config/data classes)
    "PLR2004",  # magic numbers (tests are full of them)
    "TD002",    # missing author in TODO
    "TD003",    # missing issue link in TODO
    "FIX002",   # TODO in code (we use them)
    "ERA001",   # commented-out code (too aggressive in tests)
    "TRY003",   # long exception messages (fine for user-facing errors)
    "EM101",    # exception must not use string literals
    "EM102",    # exception must not use f-strings
    "TC001",    # MOVE type-only imports into type-checking block
    "TC002",    # MOVE type-only imports into type-checking block
    "TC003",    # MOVE type-only imports into type-checking block
    "ARG001",   # unused method argument (required by protocol/base class)
    "ARG002",   # unused method argument (required by protocol/base class)
    "ARG005",   # unused lambda argument
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLW2901",  # overwritten loop variable
    "TRY300",   # try body should not contain return
    "TRY301",   # raise within try block
    "PLC0415",  # deferred imports are controlled by scripts/check_repo_policies
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"hephaion/providers/oauth.py" = ["N802"]  # HTTP handler method names are stdlib-defined
"hephaion/providers/registry.py" = ["E501"]  # model data definitions are inherently long
"scripts/check_repo_policies.py" = ["N802"]  # visit_* methods required by AST visitor pattern
"vulture-whitelist.py" = ["E501", "B018", "F821"]  # bare names are intentional vulture hints

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"
mark-parentheses = false
raises-require-match-for = ["Exception", "ValueError", "TypeError", "RuntimeError", "OSError"]

[tool.uv.build-backend]
module-name = "hephaion"
module-root = ""

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["hephaion", "tests"]
exclude = ["vulture-whitelist.py", ".venv"]

[tool.ty.rules]
all = "error"
unresolved-import = "ignore"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 8

[tool.pylint.main]
persistent = false
ignore-paths = []

[tool.pylint.reports]
score = false

[tool.vulture]
min_confidence = 80
paths = ["hephaion", "tests", "vulture-whitelist.py"]

[tool.bandit]
severity = "low"
confidence = "low"
exclude_dirs = ["tests"]
skips = ["B101", "B311", "B105", "B106", "B404", "B603", "B606"]

[tool.importlinter]
root_packages = ["hephaion"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "logging must not import adapters"
type = "forbidden"
source_modules = ["hephaion.logging"]
forbidden_modules = [
    "hephaion.cli",
    "hephaion.commands",
    "hephaion.tui",
]

[[tool.importlinter.contracts]]
name = "reusable packages must not import adapters"
type = "forbidden"
source_modules = [
    "hephaion.chat",
    "hephaion.agent",
    "hephaion.rag",
    "hephaion.providers",
    "hephaion.armory",
    "hephaion.study",
    "hephaion.memory",
    "hephaion.materials",
    "hephaion.parameters",
    "hephaion.runtime",
    "hephaion.logging",
    "hephaion.terminal.palette",
    "hephaion.matching",
    "hephaion.privacy",
    "hephaion.diagnostics",
    "hephaion.vocab",
]
forbidden_modules = [
    "hephaion.cli",
    "hephaion.commands",
    "hephaion.terminal.history",
    "hephaion.terminal.input",
    "hephaion.tui",
]

[[tool.importlinter.contracts]]
name = "materials must not import adapters, chat, agent, or rag"
type = "forbidden"
source_modules = ["hephaion.materials"]
forbidden_modules = [
    "hephaion.tui",
    "hephaion.chat",
    "hephaion.agent",
    "hephaion.rag",
    "hephaion.study",
]

[[tool.importlinter.contracts]]
name = "rag must not import agent, chat, or adapters"
type = "forbidden"
source_modules = ["hephaion.rag"]
forbidden_modules = [
    "hephaion.agent",
    "hephaion.chat",
    "hephaion.tui",
    "hephaion.study",
]

[[tool.importlinter.contracts]]
name = "runtime must stay below product workflows"
type = "forbidden"
source_modules = ["hephaion.runtime"]
forbidden_modules = [
    "hephaion.tui",
    "hephaion.chat",
    "hephaion.agent",
    "hephaion.rag",
    "hephaion.study",
    "hephaion.materials",
    "hephaion.memory",
    "hephaion.armory",
]

[[tool.importlinter.contracts]]
name = "providers must stay below product workflows"
type = "forbidden"
source_modules = ["hephaion.providers"]
forbidden_modules = [
    "hephaion.tui",
    "hephaion.chat",
    "hephaion.agent",
    "hephaion.rag",
    "hephaion.runtime",
    "hephaion.study",
    "hephaion.materials",
]

[[tool.importlinter.contracts]]
name = "memory must not import adapters, chat, or agent"
type = "forbidden"
source_modules = ["hephaion.memory"]
forbidden_modules = ["hephaion.tui", "hephaion.chat", "hephaion.agent"]

[[tool.importlinter.contracts]]
name = "study must remain a pure controller layer"
type = "forbidden"
source_modules = ["hephaion.study"]
forbidden_modules = [
    "hephaion.tui",
    "hephaion.chat",
    "hephaion.agent",
    "hephaion.rag",
]

[[tool.importlinter.contracts]]
name = "agent must not import chat.session"
type = "forbidden"
source_modules = ["hephaion.agent"]
forbidden_modules = ["hephaion.chat.session"]

[[tool.importlinter.contracts]]
name = "chat.session and chat.orchestrator are independent (no runtime imports)"
type = "independence"
modules = ["hephaion.chat.session", "hephaion.chat.orchestrator"]
ignore_imports = ["hephaion.chat.session -> hephaion.chat.orchestrator"]

[[tool.importlinter.contracts]]
name = "diagnostics must not import adapters"
type = "forbidden"
source_modules = ["hephaion.diagnostics"]
forbidden_modules = [
    "hephaion.cli",
    "hephaion.commands",
    "hephaion.tui",
]

[[tool.importlinter.contracts]]
name = "commands must not import workspace"
type = "forbidden"
source_modules = ["hephaion.commands"]
forbidden_modules = []

[[tool.importlinter.contracts]]
name = "commands must not import tui"
type = "forbidden"
source_modules = ["hephaion.commands"]
forbidden_modules = ["hephaion.tui"]

[tool.deptry]
extend_exclude = ["tests"]
# Optional RAG/docling deps are imported conditionally at runtime;
# deptry's DEP002 (unused) flags them because it can't see conditional paths.
# DEP003 on "hephaion" is a false positive — the project imports its own subpackages.
# DEP003 on "certifi" — imported directly in oauth.py SSL fallback; declared as a
# direct dependency so deptry should not flag it as merely transitive.
# DEP001 on nltk/numpy/sklearn — transitive deps of optional RAG extras.
# DEP004 on bm25s — optional runtime RAG backend installed through the rag group.
per_rule_ignores = { DEP002 = ["sentence-transformers", "scikit-learn", "docling", "py-spy", "pathspec", "rapidfuzz", "beir", "matplotlib"], DEP003 = ["hephaion", "certifi"], DEP001 = ["nltk", "numpy", "sklearn"], DEP004 = ["bm25s", "pathspec", "rapidfuzz"] }

[tool.pytest.ini_options]
addopts = "--tb=short -q --durations=10 --strict-markers -n auto --dist worksteal --cov=hephaion --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "flaky(reruns=2, reruns_delay=1): mark test as flaky — rerun on failure",
]

# Actual coverage: 77%; threshold set to 75% to buffer against flaky variations.
[tool.coverage.report]
fail_under = 75

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "deptry==0.25.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.0.1",
    "pytest-rerunfailures==16.1",
    "pytest-xdist==3.8.0",
    "pylint==4.0.5",
    "radon==6.0.1",
    "ruff==0.15.8",
    "vulture==2.16",
    "import-linter==2.11",
    "py-spy==0.4.1",
    "bandit==1.9.4",
    "ty==0.0.34",
    "pre-commit==4.6.0",
]
rag = [
    "bm25s==0.3.5",
    "sentence-transformers==5.3.0",
    "scikit-learn==1.8.0",
]
docling = [
    "docling==2.86.0",
]
