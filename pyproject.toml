[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/ai",
    "packages/extensions",
    "packages/heph",
    "packages/hephaion",
    "packages/interfaces",
]

[tool.uv.sources]
heph = { workspace = true }
heph-ai = { workspace = true }
heph-extensions = { workspace = true }
heph-interfaces = { workspace = true }
hephaion = { workspace = true }

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "A",    # flake8-builtins (shadowing)
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "R",    # refactor
    "RET",  # flake8-return
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "ERA",  # eradicate (commented-out code)
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FURB", # refurb
    "PERF", # perflint
    "N",    # naming conventions
]
ignore = [
    "PLR0913",  # too many arguments (fine for config/data classes)
    "PLR2004",  # magic numbers (tests are full of them)
    "TD002",    # missing author in TODO
    "TD003",    # missing issue link in TODO
    "FIX002",   # TODO in code (we use them)
    "ERA001",   # commented-out code (too aggressive in tests)
    "TRY003",   # long exception messages (fine for user-facing errors)
    "EM101",    # exception must not use string literals
    "EM102",    # exception must not use f-strings
    "TC001",    # MOVE type-only imports into type-checking block
    "TC002",    # MOVE type-only imports into type-checking block
    "TC003",    # MOVE type-only imports into type-checking block
    "ARG001",   # unused method argument (required by protocol/base class)
    "ARG002",   # unused method argument (required by protocol/base class)
    "ARG005",   # unused lambda argument
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLW2901",  # overwritten loop variable
    "TRY300",   # try body should not contain return
    "TRY301",   # raise within try block
    "PLC0415",  # deferred imports are controlled by scripts/check_repo_policies
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"packages/ai/src/heph_ai/providers/oauth.py" = ["N802"]  # HTTP handler method names are stdlib-defined
"packages/ai/src/heph_ai/providers/registry.py" = ["E501"]  # model data definitions are inherently long
"scripts/check_repo_policies.py" = ["N802"]  # visit_* methods required by AST visitor pattern
"vulture-whitelist.py" = ["E501", "B018", "F821"]  # bare names are intentional vulture hints

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"
mark-parentheses = false
raises-require-match-for = ["Exception", "ValueError", "TypeError", "RuntimeError", "OSError"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = [
    "packages/ai/src",
    "packages/ai/test",
    "packages/extensions/src",
    "packages/extensions/test",
    "packages/heph/src",
    "packages/heph/test",
    "packages/hephaion/src",
    "packages/hephaion/test",
    "packages/interfaces/src",
    "packages/interfaces/test",
    "tests",
]
exclude = ["vulture-whitelist.py", ".venv"]

[tool.ty.rules]
all = "error"
unresolved-import = "ignore"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 8

[tool.pylint.main]
persistent = false
ignore-paths = []

[tool.pylint.reports]
score = false

[tool.vulture]
min_confidence = 80
paths = [
    "packages/ai/src",
    "packages/ai/test",
    "packages/extensions/src",
    "packages/extensions/test",
    "packages/heph/src",
    "packages/heph/test",
    "packages/hephaion/src",
    "packages/hephaion/test",
    "packages/interfaces/src",
    "packages/interfaces/test",
    "tests",
    "vulture-whitelist.py",
]

[tool.bandit]
severity = "low"
confidence = "low"
exclude_dirs = [
    "packages/ai/test",
    "packages/extensions/test",
    "packages/heph/test",
    "packages/hephaion/test",
    "packages/interfaces/test",
    "tests",
]
skips = ["B101", "B311", "B105", "B106", "B404", "B603", "B606"]

[tool.importlinter]
root_packages = [
    "agent",
    "armory",
    "chat",
    "diagnostics",
    "heph",
    "heph_ai",
    "heph_extensions",
    "heph_interfaces",
    "matching",
    "materials",
    "memory",
    "parameters",
    "privacy",
    "rag",
    "safety",
    "study",
    "vocab",
]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "heph_ai must stay below product workflows"
type = "forbidden"
source_modules = ["heph_ai"]
forbidden_modules = [
    "heph",
    "heph_interfaces",
    "agent",
    "armory",
    "chat",
    "diagnostics",
    "matching",
    "materials",
    "memory",
    "parameters",
    "privacy",
    "rag",
    "safety",
    "study",
    "vocab",
]

[[tool.importlinter.contracts]]
name = "heph_extensions stays contract-first"
type = "forbidden"
source_modules = ["heph_extensions"]
forbidden_modules = [
    "heph",
    "heph_interfaces",
    "heph_interfaces.tui",
    "agent",
    "armory",
    "chat",
    "diagnostics",
    "matching",
    "materials",
    "memory",
    "parameters",
    "privacy",
    "rag",
    "safety",
    "study",
    "vocab",
    "heph_ai.runtime",
    "heph_ai.providers",
]

[[tool.importlinter.contracts]]
name = "hephaion harness concerns must not import app or interfaces"
type = "forbidden"
source_modules = [
    "agent",
    "armory",
    "chat",
    "diagnostics",
    "matching",
    "materials",
    "memory",
    "parameters",
    "privacy",
    "rag",
    "safety",
    "study",
    "vocab",
]
forbidden_modules = [
    "heph",
    "heph_interfaces",
]

[[tool.importlinter.contracts]]
name = "materials must not import adapters, chat, agent, or rag"
type = "forbidden"
source_modules = ["materials"]
forbidden_modules = [
    "chat",
    "agent",
    "rag",
    "study",
]

[[tool.importlinter.contracts]]
name = "rag must not import agent, chat, or adapters"
type = "forbidden"
source_modules = ["rag"]
forbidden_modules = [
    "agent",
    "chat",
    "study",
]

[[tool.importlinter.contracts]]
name = "memory must not import adapters, chat, or agent"
type = "forbidden"
source_modules = ["memory"]
forbidden_modules = ["chat", "agent"]

[[tool.importlinter.contracts]]
name = "study must remain a pure controller layer"
type = "forbidden"
source_modules = ["study"]
forbidden_modules = [
    "chat",
    "agent",
    "rag",
]

[[tool.importlinter.contracts]]
name = "agent must not import chat"
type = "forbidden"
source_modules = ["agent"]
forbidden_modules = ["chat"]

[[tool.importlinter.contracts]]
name = "chat.session and chat.orchestrator are independent (no runtime imports)"
type = "independence"
modules = ["chat.session", "chat.orchestrator"]

[[tool.importlinter.contracts]]
name = "heph_interfaces must not import heph app composition"
type = "forbidden"
source_modules = ["heph_interfaces"]
forbidden_modules = ["heph"]

[tool.deptry]
extend_exclude = [
    "packages/ai/test",
    "packages/extensions/test",
    "packages/heph/test",
    "packages/hephaion/test",
    "packages/interfaces/test",
    "tests",
]
# Docling and optional RAG deps are imported conditionally at runtime;
# deptry's DEP002 (unused) flags them because it can't see conditional paths.
# DEP003 on "hephaion" is a false positive — the project imports its own subpackages.
# DEP003 on "certifi" — imported directly in oauth.py SSL fallback; declared as a
# direct dependency so deptry should not flag it as merely transitive.
# DEP001 on nltk/numpy/sklearn — transitive deps of optional RAG extras.
# DEP004 on bm25s — optional runtime RAG backend installed through the rag group.
per_rule_ignores = { DEP002 = ["sentence-transformers", "scikit-learn", "docling", "py-spy", "pathspec", "rapidfuzz", "beir", "matplotlib"], DEP003 = ["heph", "heph_ai", "heph_extensions", "heph_interfaces", "hephaion", "certifi", "defusedxml", "yaml"], DEP001 = ["nltk", "numpy", "sklearn"], DEP004 = ["bm25s", "pathspec", "rapidfuzz"] }

[tool.pytest.ini_options]
addopts = "--tb=short -q --durations=10 --strict-markers -n auto --dist worksteal --cov=agent --cov=armory --cov=chat --cov=diagnostics --cov=heph --cov=heph_ai --cov=heph_extensions --cov=heph_interfaces --cov=materials --cov=memory --cov=parameters --cov=privacy --cov=rag --cov=safety --cov=study --cov=vocab --cov-report=term-missing --cov-fail-under=46"
testpaths = [
    "packages/ai/test",
    "packages/extensions/test",
    "packages/heph/test",
    "packages/hephaion/test",
    "packages/interfaces/test",
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "flaky(reruns=2, reruns_delay=1): mark test as flaky — rerun on failure",
]

# Current production coverage baseline is below the long-term 75% target.
# Raise this as characterization coverage increases during architecture refactors.
[tool.coverage.report]
fail_under = 46

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "deptry==0.25.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.0.1",
    "pytest-rerunfailures==16.1",
    "pytest-xdist==3.8.0",
    "pylint==4.0.5",
    "radon==6.0.1",
    "ruff==0.15.8",
    "vulture==2.16",
    "import-linter==2.11",
    "py-spy==0.4.1",
    "bandit==1.9.4",
    "ty==0.0.34",
    "pre-commit==4.6.0",
]
rag = [
    "bm25s==0.3.5",
    "sentence-transformers==5.3.0",
    "scikit-learn==1.8.0",
]
beir = [
    "beir==2.2.0",
]
visualization = [
    "matplotlib==3.10.8",
]
