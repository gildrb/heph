# Default parameters for Hephaistos.
# Provider, model, API key, and global shell preferences are configured via
# /provider, /models, /api, /settings, or environment variables — not here.

max_tokens = 4096

# Logging configuration (overridden by HEPHAISTOS_LOG_* env vars)
# log_level = "WARNING"     # DEBUG, INFO, WARNING, ERROR
# log_file = ""             # Path to append-only log file
# log_format = "json"      # "json" or "text"

# Local diagnostics
# Trace files live under <armory>/.hephaistos/traces/
# CPU profiles are written to ~/.cache/hephaistos/profiles/
