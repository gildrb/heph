[project]
name = "heph-ai"
version = "0.1.0"
description = "Provider, model, and runtime primitives for Heph"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "certifi==2026.2.25",
    "keyring==25.7.0",
    "openai==2.24.0",
]

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "ai_diagnostics",
    "ai_logging",
    "ai_types",
    "palette",
    "providers",
    "runtime",
]
module-root = "src"

[tool.deptry]
# Token counting uses tiktoken when it is present and falls back otherwise.
per_rule_ignores = { DEP001 = ["tiktoken"] }
