[project]
name = "heph-interfaces"
version = "0.0.58"
description = "CLI/TUI adapter interfaces for Heph"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "heph-ai==0.0.58",
    "harness==0.0.58",
    "rich==14.3.3",
    "textual==8.2.4",
    "unicodeit==0.7.5",
]

[tool.uv.sources]
heph-ai = { workspace = true }
harness = { workspace = true }

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["interfaces"]
module-root = "src"

[tool.deptry]
package_module_name_map = { heph-ai = ["ai"], harness = ["harness"] }
