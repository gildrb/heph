[project]
name = "heph-extensions"
version = "0.1.0"
description = "Stable extension contracts for Heph and Hephaion"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["extension_contracts"]
