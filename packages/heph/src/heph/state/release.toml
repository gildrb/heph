# Official user-facing Heph release pointer.
#
# This is the stable public version the repository treats as releasable through
# the PyPI release workflow. Main can keep moving; update this file only when a
# reviewed version is ready to become the public stable release.

package = "heph"
command = "heph"
channel = "stable"
version = "0.1.49"
tag = "v0.1.49"
release_workflow = ".github/workflows/release.yml"
edge_workflow = ".github/workflows/deploy.yml"
