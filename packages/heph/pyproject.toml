[project]
name = "heph"
version = "0.1.49"
description = "Local-first document workspace for grounded answers, citations, memory, and recall practice with any LLM"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gil", email = "hi@gildrb.com" },
]
requires-python = ">=3.13"
keywords = ["cli", "documents", "llm", "rag", "retrieval", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "heph-ai==0.1.49",
    "heph-extensions==0.1.49",
    "heph-interfaces==0.1.49",
    "hephaion==0.1.49",
]

[project.urls]
Homepage = "https://github.com/gildrb/heph"
Repository = "https://github.com/gildrb/heph"
Issues = "https://github.com/gildrb/heph/issues"

[project.scripts]
heph = "heph.cli.main:main"
hephaion = "heph.cli.main:main"

[tool.uv.sources]
heph-ai = { workspace = true }
heph-extensions = { workspace = true }
heph-interfaces = { workspace = true }
hephaion = { workspace = true }

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["heph"]
module-root = "src"

[tool.deptry]
package_module_name_map = { heph-ai = ["ai"], heph-extensions = ["extensions"], heph-interfaces = ["interfaces"], hephaion = ["hephaion"] }
