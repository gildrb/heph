[project]
name = "heph"
version = "0.0.62"
description = "Local document agent for accurate, cited answers."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gil", email = "hi@gildrb.com" },
]
requires-python = ">=3.13"
keywords = ["agent", "cli", "documents", "llm", "rag", "retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "heph-ai==0.0.62",
    "heph-interfaces==0.0.62",
    "harness==0.0.62",
]

[project.urls]
Homepage = "https://github.com/gildrb/heph"
Repository = "https://github.com/gildrb/heph"
Issues = "https://github.com/gildrb/heph/issues"

[project.scripts]
heph = "heph.cli.main:main"

[tool.uv.sources]
heph-ai = { workspace = true }
heph-interfaces = { workspace = true }
harness = { workspace = true }

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["heph"]
module-root = "src"

[tool.deptry]
package_module_name_map = { heph-ai = ["ai"], heph-interfaces = ["interfaces"], harness = ["harness"] }
