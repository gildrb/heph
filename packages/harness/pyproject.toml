[project]
name = "harness"
version = "0.0.62"
description = "Correctness harness for grounded, cited Heph answers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "defusedxml==0.7.1",
    "heph-ai==0.0.62",
    "pypdfium2==5.10.1",
    "unicodeit==0.7.5",
]

[tool.uv.sources]
heph-ai = { workspace = true }

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["harness"]
module-root = "src"

[tool.deptry]

[tool.deptry.package_module_name_map]
heph-ai = ["ai"]

[tool.deptry.per_rule_ignores]
DEP001 = ["nltk", "pathspec", "rapidfuzz", "tiktoken"]
DEP002 = ["pypdfium2"]
