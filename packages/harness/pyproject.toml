[project]
name = "harness"
version = "0.0.56"
description = "Correctness harness for grounded, cited Heph answers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "bm25s==0.3.5",
    "docling-slim[standard]==2.94.0",
    "heph-ai==0.0.56",
    "heph-extensions==0.0.56",
    "scikit-learn==1.8.0",
    "sentence-transformers==5.3.0",
    "unicodeit==0.7.5",
]

[tool.uv.sources]
heph-ai = { workspace = true }
heph-extensions = { workspace = true }

[build-system]
requires = ["uv_build==0.11.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["harness"]
module-root = "src"

[tool.deptry]
# These backends are loaded through runtime availability checks so Heph can
# still degrade cleanly if an installation is externally damaged.

[tool.deptry.package_module_name_map]
docling-slim = ["docling"]
heph-ai = ["ai"]
heph-extensions = ["extensions"]
scikit-learn = ["sklearn"]
sentence-transformers = ["sentence_transformers"]

[tool.deptry.per_rule_ignores]
DEP001 = ["nltk", "pathspec", "rapidfuzz", "tiktoken"]
DEP002 = ["bm25s", "docling-slim", "scikit-learn", "sentence-transformers"]
