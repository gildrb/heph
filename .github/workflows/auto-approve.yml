name: Dependency PR Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  dependency-review-required:
    if: github.actor == 'renovate[bot]' || github.actor == 'renovate[bot][app]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark dependency PR as requiring review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Dependency updates are reviewed code changes. This PR requires manual review before merge."
