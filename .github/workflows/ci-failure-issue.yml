name: CI Failure Issue

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read

jobs:
  handle-ci-result:
    runs-on: ubuntu-latest
    steps:
      - name: Manage failure issue
        if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
        env:
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          if [ "$WORKFLOW_EVENT" != "push" ] || [ "$BRANCH" != "main" ] || [ "$HEAD_REPOSITORY" != "$REPO" ]; then
            echo "CI $CONCLUSION for $WORKFLOW_EVENT on $BRANCH -- no action needed"
            exit 0
          fi

          TRACKING_MARKER="<!-- hephaion-ci-failure-main -->"
          TRACKING_LABEL="status/ci-failure"
          FIND_MANAGED_ISSUES='map(select((.body // "") | contains("<!-- hephaion-ci-failure-main -->")) | select(.author.is_bot == true) | select(any(.labels[]?; .name == "status/ci-failure"))) | sort_by(.number) | reverse | map(.number) | @tsv'
          CURRENT_MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || echo "")

          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "Unable to verify current main SHA -- no action taken"
            exit 0
          fi

          if [ "$SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "Ignoring stale CI $CONCLUSION for ${SHA:0:7}; current main is ${CURRENT_MAIN_SHA:0:7}"
            exit 0
          fi

          if [ "$CONCLUSION" = "failure" ]; then
            echo "CI failed on main -- creating/updating issue"
            TITLE="CI failure on main (${SHA:0:7})"

            MANAGED_ISSUES=$(gh issue list --repo "$REPO" --state open --label "$TRACKING_LABEL" --limit 200 --json number,body,author,labels --jq "$FIND_MANAGED_ISSUES" 2>/dev/null || echo "")
            read -r -a MANAGED_NUMBERS <<< "$MANAGED_ISSUES"
            EXISTING="${MANAGED_NUMBERS[0]:-}"

            FAILED_JOBS=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | "- **" + .name + "**: " + (.steps | map(select(.conclusion == "failure")) | map(.name) | join(", "))' 2>/dev/null || echo "Unable to fetch job details")

            BODY="${TRACKING_MARKER}

          ## CI Failure Report

          - **Commit**: \`${SHA:0:7}\`
          - **Branch**: \`${BRANCH}\`
          - **Run**: [View CI Run](${RUN_URL})
          - **Triggered by**: @${ACTOR}
          - **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')

          ### Failed Jobs

          ${FAILED_JOBS}

          ---
          *This issue was automatically created by the CI failure workflow.*"

            if [ -n "$EXISTING" ]; then
              echo "Updating existing issue #$EXISTING"
              gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" \
                --add-label "type/bug" \
                --add-label "area/infra" \
                --add-label "$TRACKING_LABEL"
              gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
            else
              echo "Creating new issue"
              ISSUE_URL=$(gh issue create --repo "$REPO" \
                --title "$TITLE" \
                --body "$BODY" \
                --label "type/bug" \
                --label "area/infra" \
                --label "$TRACKING_LABEL")
              EXISTING="${ISSUE_URL##*/}"
            fi

            for DUPLICATE in "${MANAGED_NUMBERS[@]:1}"; do
              if [ -n "$DUPLICATE" ] && [ "$DUPLICATE" != "$EXISTING" ]; then
                echo "Closing duplicate managed issue #$DUPLICATE"
                gh issue close "$DUPLICATE" --repo "$REPO" \
                  --comment "Superseded by the current managed main-branch CI failure issue #$EXISTING. [Run](${RUN_URL})"
              fi
            done

          elif [ "$CONCLUSION" = "success" ]; then
            echo "CI passed on main -- closing any open failure issues"
            MANAGED_ISSUES=$(gh issue list --repo "$REPO" --state open --label "$TRACKING_LABEL" --limit 200 --json number,body,author,labels --jq "$FIND_MANAGED_ISSUES" 2>/dev/null || echo "")
            read -r -a MANAGED_NUMBERS <<< "$MANAGED_ISSUES"

            if [ "${#MANAGED_NUMBERS[@]}" -gt 0 ]; then
              for ISSUE in "${MANAGED_NUMBERS[@]}"; do
                if [ -n "$ISSUE" ]; then
                  echo "Closing issue #$ISSUE -- CI is now passing"
                  gh issue close "$ISSUE" --repo "$REPO" \
                    --comment "CI is now passing on main. Closing. [Run](${RUN_URL})"
                fi
              done
            else
              echo "No open failure issue to close"
            fi
          else
            echo "CI $CONCLUSION on $BRANCH -- no action needed"
          fi
