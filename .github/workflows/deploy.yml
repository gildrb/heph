name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy to edge"
        required: false
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: edge
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
    steps:
      - name: Validate deploy ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Edge deploys must be dispatched from main"
            exit 1
          fi

          if [ "$DEPLOY_REF" != "main" ]; then
            echo "Ref must be main for edge deploys"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Repo policy check
        run: uv run python -m scripts.check_repo_policies

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ty
        run: uv run ty check

      - name: Bandit
        run: uv run bandit -r hephaion -c pyproject.toml

      - name: Vulture
        run: uv run vulture hephaion tests vulture-whitelist.py

      - name: Pylint duplicate-code
        run: uv run pylint --disable=all --enable=duplicate-code hephaion

      - name: Pytest
        run: uv run pytest

      - name: Inject edge privacy and diagnostics config
        env:
          HEPHAION_POSTHOG_HOST: ${{ secrets.HEPHAION_POSTHOG_HOST }}
          HEPHAION_POSTHOG_PROJECT_TOKEN: ${{ secrets.HEPHAION_POSTHOG_PROJECT_TOKEN }}
          HEPHAION_SENTRY_DSN: ${{ secrets.HEPHAION_SENTRY_DSN }}
          HEPHAION_RELEASE_CHANNEL: edge
          HEPHAION_RELEASE_VERSION: edge-${{ github.sha }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          def literal(value: str) -> str:
              stripped = value.strip()
              return json.dumps(stripped) if stripped else "None"

          target = Path("hephaion/privacy/release.py")
          target.write_text(
              "\n".join(
                  [
                      '"""Release-time privacy and diagnostics configuration."""',
                      "",
                      "from __future__ import annotations",
                      "",
                      f"POSTHOG_HOST: str | None = {literal(os.environ.get('HEPHAION_POSTHOG_HOST', ''))}",
                      (
                          "POSTHOG_PROJECT_TOKEN: str | None = "
                          f"{literal(os.environ.get('HEPHAION_POSTHOG_PROJECT_TOKEN', ''))}"
                      ),
                      f"SENTRY_DSN: str | None = {literal(os.environ.get('HEPHAION_SENTRY_DSN', ''))}",
                      f"RELEASE_CHANNEL: str | None = {literal(os.environ.get('HEPHAION_RELEASE_CHANNEL', ''))}",
                      f"RELEASE_VERSION: str | None = {literal(os.environ.get('HEPHAION_RELEASE_VERSION', ''))}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: edge
    permissions:
      contents: write
      deployments: write
    env:
      EDGE_REF: main
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Create edge deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/deployments" \
            --input - <<EOF
          {
            "ref": "${GITHUB_SHA}",
            "environment": "edge",
            "description": "Deploy ${GITHUB_SHA} to edge",
            "auto_merge": false,
            "required_contexts": []
          }
          EOF

      - name: Recreate edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view edge >/dev/null 2>&1; then
            gh release delete edge --cleanup-tag --yes
          fi

          gh release create edge \
            --prerelease \
            --title "Edge Build" \
            --target "${GITHUB_SHA}" \
            --notes "Rolling edge build for ${GITHUB_SHA}"

          gh release upload edge dist/* --clobber

      - name: Notify deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No webhook URL configured, skipping notification"
            exit 0
          fi
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"edge\",\"commit\":\"${GITHUB_SHA}\",\"environment\":\"edge\",\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${EDGE_REF}\",\"trigger\":\"workflow_dispatch\"}" \
            "${DEPLOY_WEBHOOK_URL}" || true
