name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy to edge"
        required: false
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: edge
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || github.ref_name }}
    steps:
      - name: Validate deploy ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Edge deploys must be dispatched from main"
            exit 1
          fi

          if [ "$DEPLOY_REF" != "main" ]; then
            echo "Ref must be main for edge deploys"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dev dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Repo policy check
        run: uv run --no-sync python -m scripts.check_repo_policies

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Ty
        run: uv run --no-sync ty check

      - name: Bandit
        run: uv run --no-sync bandit -r packages/ai/src packages/extensions/src packages/heph/src packages/harness/src packages/interfaces/src -c pyproject.toml

      - name: Vulture
        run: uv run --no-sync vulture packages/ai/src packages/extensions/src packages/heph/src packages/harness/src packages/interfaces/src packages/ai/test packages/extensions/test packages/heph/test packages/harness/test packages/interfaces/test vulture-whitelist.py

      - name: Pylint duplicate-code
        run: uv run --no-sync pylint --disable=all --enable=duplicate-code packages/ai/src packages/extensions/src packages/heph/src packages/harness/src packages/interfaces/src

      - name: Pytest
        run: uv run --no-sync pytest

      - name: Build package
        env:
          HARNESS_POSTHOG_HOST: ${{ secrets.HARNESS_POSTHOG_HOST }}
          HARNESS_POSTHOG_PROJECT_TOKEN: ${{ secrets.HARNESS_POSTHOG_PROJECT_TOKEN }}
          HARNESS_SENTRY_DSN: ${{ secrets.HARNESS_SENTRY_DSN }}
        run: |
          uv run --no-sync python -m scripts.build_release_artifacts \
            --allow-dirty-build-inputs \
            --channel edge \
            --release-version "edge-${{ github.sha }}"

      - name: Release state check
        run: uv run --no-sync python -m scripts.check_release_state

      - name: Generate runtime SBOM
        run: |
          mkdir -p .artifacts/release
          uv export --frozen --no-dev --format cyclonedx1.5 --output-file .artifacts/release/heph-runtime-sbom.cdx.json > /dev/null
          uv export --frozen --no-dev --format pylock.toml --output-file .artifacts/release/pylock.runtime.toml > /dev/null

      - name: Release stress test
        run: uv run --no-sync python -m scripts.release_stress_test --expect-runtime-channel edge --expect-runtime-version "edge-${{ github.sha }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*
            .artifacts/release/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: .artifacts/release/*

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: edge
    permissions:
      contents: write
      deployments: write
    env:
      EDGE_REF: main
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      - name: Create edge deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/deployments" \
            --input - <<EOF
          {
            "ref": "${GITHUB_SHA}",
            "environment": "edge",
            "description": "Deploy ${GITHUB_SHA} to edge",
            "auto_merge": false,
            "required_contexts": []
          }
          EOF

      - name: Recreate edge prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view edge >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/edge" \
              -f sha="${GITHUB_SHA}" \
              -F force=true

            gh release edit edge \
              --prerelease \
              --title "Edge Build" \
              --target "${GITHUB_SHA}" \
              --notes "Rolling edge build for ${GITHUB_SHA}"
          else
            gh release create edge \
              --prerelease \
              --title "Edge Build" \
              --target "${GITHUB_SHA}" \
              --notes "Rolling edge build for ${GITHUB_SHA}"
          fi

          gh release view edge --json assets --jq '.assets[].name' |
            while IFS= read -r asset_name; do
              if [ -n "${asset_name}" ]; then
                gh release delete-asset edge "${asset_name}" --yes
              fi
            done

          gh release upload edge dist/* --clobber
          gh release upload edge release-assets/* --clobber

      - name: Notify deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No webhook URL configured, skipping notification"
            exit 0
          fi
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"edge\",\"commit\":\"${GITHUB_SHA}\",\"environment\":\"edge\",\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${EDGE_REF}\",\"trigger\":\"workflow_dispatch\"}" \
            "${DEPLOY_WEBHOOK_URL}" || true
