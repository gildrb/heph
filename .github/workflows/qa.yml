name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FACTORY_DISABLE_KEYRING: "true"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install tuistory
        # Supply chain note: tuistory@latest is intentionally unpinned for now and should be pinned.
        run: npm install -g tuistory@latest

      - name: Install ImageMagick
        run: sudo apt-get install -y -qq imagemagick

      - name: Install Droid CLI
        # Supply chain note: piping a remote installer to sh is risky and should be replaced.
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Create results directory
        run: mkdir -p qa-results

      - name: Run QA
        id: qa
        continue-on-error: true
        timeout-minutes: 20
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          FACTORY_DISABLE_KEYRING: "true"
        run: |
          droid exec --auto high --skill qa \
            --prompt "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill. Analyze the git diff for this PR and run relevant test flows. Write the final report to qa-results/report.md" \
            2>&1 | tee qa-results/qa-output.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-results
          path: qa-results/
          retention-days: 14

      - name: Post QA report as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build report body
          if [ -f qa-results/report.md ]; then
            BODY=$(cat qa-results/report.md)
          else
            BODY="## QA Report\n\n:no_entry: QA run completed but no report was generated. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\n<details><summary>Raw output</summary>\n\n\`\`\`\n$(cat qa-results/qa-output.txt 2>/dev/null || echo 'No output captured')\n\`\`\`\n</details>"
          fi

          # Ensure report starts with heading
          if ! echo "$BODY" | grep -q "^## QA Report"; then
            BODY="## QA Report\n\n$BODY"
          fi

          # Add footer
          FOOTER="\n\n---\n*QA run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) | [Download artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)*"
          BODY="${BODY}${FOOTER}"

          # Add hidden marker for comment dedup
          MARKER="<!-- qa-report -->"
          FULL_BODY="${MARKER}\n${BODY}"

          # Check for existing QA comment
          PR_NUMBER="${{ github.event.pull_request.number }}"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"<!-- qa-report -->\")) | .id" 2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            # Update existing comment
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              --method PATCH \
              --field body="${FULL_BODY}" \
              --silent
          else
            # Create new comment
            echo -e "$FULL_BODY" | gh pr comment "$PR_NUMBER" --body-file -
          fi
