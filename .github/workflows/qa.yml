name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      FACTORY_DISABLE_KEYRING: "true"
      HEPHAISTOS_DISABLE_LIVE_MODELS: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install tuistory
        run: npm install -g tuistory@0.4.1

      - name: Install ImageMagick
        run: sudo apt-get install -y -qq imagemagick

      - name: Install Droid CLI
        run: curl -fsSL https://app.factory.ai/cli | sh

      - name: Create results directory
        run: mkdir -p qa-results

      - name: Run QA
        id: qa
        continue-on-error: true
        timeout-minutes: 20
        env:
          FACTORY_DISABLE_KEYRING: "true"
        run: |
          droid exec --auto high --skill qa \
            --prompt "You are running in a non-interactive CI environment. There is NO human available. Do NOT use AskUser, do NOT wait for confirmations, do NOT pause for input. Run the qa skill using keyless or mocked providers only. Analyze the git diff for this PR and run relevant test flows. Write the final report to qa-results/report.md" \
            2>&1 | tee qa-results/qa-output.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-results
          path: qa-results/
          retention-days: 14

  qa-comment:
    needs: qa
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download QA artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qa-results
          path: qa-results

      - name: Post QA report as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # Build report body
          if [ -f qa-results/report.md ]; then
            BODY=$(cat qa-results/report.md)
          else
            BODY="## QA Report\n\nQA run completed but no report was generated. Check the workflow logs or downloaded artifacts for details."
          fi

          # Ensure report starts with heading
          if ! echo "$BODY" | grep -q "^## QA Report"; then
            BODY="## QA Report\n\n$BODY"
          fi

          # Add footer
          FOOTER="\n\n---\n*QA run [#${RUN_NUMBER}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) | [Download artifacts](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}#artifacts)*"
          BODY="${BODY}${FOOTER}"

          # Add hidden marker for comment dedup
          MARKER="<!-- qa-report -->"
          FULL_BODY="${MARKER}\n${BODY}"

          # Check for existing QA comment
          EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"<!-- qa-report -->\")) | .id" 2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            # Update existing comment
            gh api "repos/${REPO}/issues/comments/${EXISTING}" \
              --method PATCH \
              --field body="${FULL_BODY}" \
              --silent
          else
            # Create new comment
            echo -e "$FULL_BODY" | gh pr comment "$PR_NUMBER" --body-file -
          fi
