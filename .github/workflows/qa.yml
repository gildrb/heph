name: QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      FACTORY_DISABLE_KEYRING: "true"
      HARNESS_DISABLE_LIVE_MODELS: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --group dev --group full

      - name: Create results directory
        run: mkdir -p qa-results

      - name: Run QA
        id: qa
        timeout-minutes: 20
        env:
          FACTORY_DISABLE_KEYRING: "true"
        run: |
          set +e
          set -o pipefail
          {
            echo "## QA Report"
            echo ""
            echo "### Keyless CLI and TUI stress checks"
            echo ""
            echo '```'
            uv run --no-sync pytest \
              packages/harness/test/test_rag_index.py \
              packages/interfaces/test/test_tui_keyboard_protocol.py \
              -q --no-cov
            status=$?
            echo '```'
            echo ""
            echo "status=${status}"
            exit "$status"
          } 2>&1 | tee qa-results/qa-output.txt qa-results/report.md
          status="${PIPESTATUS[0]}"
          exit "$status"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-results
          path: qa-results/
          retention-days: 14

  qa-comment:
    needs: qa
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Post QA report as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QA_RESULT: ${{ needs.qa.result }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          MARKER="<!-- qa-report -->"
          FULL_BODY="${MARKER}
          ## QA Report

          Result: \`${QA_RESULT}\`

          QA run [#${RUN_NUMBER}](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}) completed. Download the workflow artifact to inspect the raw report and logs."

          # Check for existing QA comment
          EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"<!-- qa-report -->\")) | .id" 2>/dev/null | head -1)

          if [ -n "$EXISTING" ]; then
            # Update existing comment
            gh api "repos/${REPO}/issues/comments/${EXISTING}" \
              --method PATCH \
              --field body="${FULL_BODY}" \
              --silent
          else
            # Create new comment
            echo -e "$FULL_BODY" | gh pr comment "$PR_NUMBER" --body-file -
          fi
