name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual releases must be dispatched from main"
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag provenance
        run: |
          git fetch --force origin main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag does not exist"
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag must point to a commit reachable from main"
            exit 1
          fi

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dev dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Repo policy check
        run: uv run python -m scripts.check_repo_policies

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ty
        run: uv run ty check

      - name: Bandit
        run: uv run bandit -r packages/hephaion -c pyproject.toml

      - name: Vulture
        run: uv run vulture packages/hephaion tests vulture-whitelist.py

      - name: Pylint duplicate-code
        run: uv run pylint --disable=all --enable=duplicate-code packages/hephaion

      - name: Pytest
        run: uv run pytest

      - name: Inject release privacy and diagnostics config
        env:
          HEPHAION_POSTHOG_HOST: ${{ secrets.HEPHAION_POSTHOG_HOST }}
          HEPHAION_POSTHOG_PROJECT_TOKEN: ${{ secrets.HEPHAION_POSTHOG_PROJECT_TOKEN }}
          HEPHAION_SENTRY_DSN: ${{ secrets.HEPHAION_SENTRY_DSN }}
          HEPHAION_RELEASE_CHANNEL: pypi
          HEPHAION_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          def literal(value: str) -> str:
              stripped = value.strip()
              return json.dumps(stripped) if stripped else "None"

          target = Path("packages/hephaion/privacy/release.py")
          target.write_text(
              "\n".join(
                  [
                      '"""Release-time privacy and diagnostics configuration."""',
                      "",
                      "from __future__ import annotations",
                      "",
                      f"POSTHOG_HOST: str | None = {literal(os.environ.get('HEPHAION_POSTHOG_HOST', ''))}",
                      (
                          "POSTHOG_PROJECT_TOKEN: str | None = "
                          f"{literal(os.environ.get('HEPHAION_POSTHOG_PROJECT_TOKEN', ''))}"
                      ),
                      f"SENTRY_DSN: str | None = {literal(os.environ.get('HEPHAION_SENTRY_DSN', ''))}",
                      f"RELEASE_CHANNEL: str | None = {literal(os.environ.get('HEPHAION_RELEASE_CHANNEL', ''))}",
                      f"RELEASE_VERSION: str | None = {literal(os.environ.get('HEPHAION_RELEASE_VERSION', ''))}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Build package
        run: uv build --build-constraints build-constraints.txt --require-hashes --no-sources

      - name: Generate runtime SBOM
        run: |
          mkdir -p .artifacts/release
          uv export --frozen --no-dev --format cyclonedx1.5 --output-file .artifacts/release/heph-runtime-sbom.cdx.json > /dev/null
          uv export --frozen --no-dev --format pylock.toml --output-file .artifacts/release/pylock.runtime.toml > /dev/null

      - name: Generate optional dependency SBOM
        run: |
          mkdir -p .artifacts/release
          uv export --frozen --no-dev --all-extras --format cyclonedx1.5 --output-file .artifacts/release/heph-optional-sbom.cdx.json > /dev/null
          uv export --frozen --no-dev --all-extras --format pylock.toml --output-file .artifacts/release/pylock.optional.toml > /dev/null

      - name: Release stress test
        run: uv run python -m scripts.release_stress_test

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*
            .artifacts/release/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: .artifacts/release/*

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual releases must be dispatched from main"
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag provenance
        run: |
          git fetch --force origin main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag must point to a commit reachable from main"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Generate release notes
        id: notes
        env:
          NOTES_PATH: /tmp/release-notes.md
          REPO: ${{ github.repository }}
        run: |
          TAG="$RELEASE_TAG"
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          {
            echo "## What changed"
            echo ""
            git log "${RANGE}" --pretty=format:"- %s (%h)" --no-merges | head -50
            echo ""
            echo ""
            echo "## Full diff"
            echo ""
            echo "https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          } > "$NOTES_PATH"
          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          TAG="$RELEASE_TAG"
          gh release create "${TAG}" \
            dist/* \
            release-assets/* \
            --title "${TAG}" \
            --notes-file "${RELEASE_NOTES_PATH}"

      - name: Notify release
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No webhook URL configured, skipping notification"
            exit 0
          fi
          TAG="$RELEASE_TAG"
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${TAG}\",\"commit\":\"${GITHUB_SHA}\",\"environment\":\"pypi\",\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${TAG}\",\"trigger\":\"release\"}" \
            "${DEPLOY_WEBHOOK_URL}" || true
