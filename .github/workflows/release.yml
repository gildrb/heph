name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Basedpyright
        run: uv run basedpyright

      - name: Bandit
        run: uv run bandit -r hephaistos -c pyproject.toml

      - name: Vulture
        run: uv run vulture hephaistos tests vulture-whitelist.py

      - name: Pylint duplicate-code
        run: uv run pylint --disable=all --enable=duplicate-code hephaistos

      - name: Pytest
        run: uv run pytest

      - name: Inject release telemetry config
        env:
          HEPHAISTOS_POSTHOG_HOST: ${{ secrets.HEPHAISTOS_POSTHOG_HOST }}
          HEPHAISTOS_POSTHOG_PROJECT_TOKEN: ${{ secrets.HEPHAISTOS_POSTHOG_PROJECT_TOKEN }}
          HEPHAISTOS_SENTRY_DSN: ${{ secrets.HEPHAISTOS_SENTRY_DSN }}
          HEPHAISTOS_RELEASE_CHANNEL: pypi
          HEPHAISTOS_RELEASE_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          def literal(value: str) -> str:
              stripped = value.strip()
              return json.dumps(stripped) if stripped else "None"

          target = Path("hephaistos/_telemetry_release.py")
          target.write_text(
              "\n".join(
                  [
                      '"""Release-time telemetry configuration."""',
                      "",
                      "from __future__ import annotations",
                      "",
                      f"POSTHOG_HOST: str | None = {literal(os.environ.get('HEPHAISTOS_POSTHOG_HOST', ''))}",
                      (
                          "POSTHOG_PROJECT_TOKEN: str | None = "
                          f"{literal(os.environ.get('HEPHAISTOS_POSTHOG_PROJECT_TOKEN', ''))}"
                      ),
                      f"SENTRY_DSN: str | None = {literal(os.environ.get('HEPHAISTOS_SENTRY_DSN', ''))}",
                      f"RELEASE_CHANNEL: str | None = {literal(os.environ.get('HEPHAISTOS_RELEASE_CHANNEL', ''))}",
                      f"RELEASE_VERSION: str | None = {literal(os.environ.get('HEPHAISTOS_RELEASE_VERSION', ''))}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          {
            echo "## What changed"
            echo ""
            git log "${RANGE}" --pretty=format:"- %s (%h)" --no-merges | head -50
            echo ""
            echo ""
            echo "## Full diff"
            echo ""
            echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          } > /tmp/release-notes.md
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "${TAG}" \
            dist/* \
            --title "${TAG}" \
            --notes-file "${{ steps.notes.outputs.path }}"

      - name: Notify release
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${TAG}\",\"commit\":\"${GITHUB_SHA}\",\"environment\":\"pypi\",\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${TAG}\",\"trigger\":\"release\"}" \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}" || true
