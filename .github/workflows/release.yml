name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Repo policy check
        run: uv run python -m scripts.check_repo_policies

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ty
        run: uv run ty check

      - name: Bandit
        run: uv run bandit -r hephaistos -c pyproject.toml

      - name: Vulture
        run: uv run vulture hephaistos tests vulture-whitelist.py

      - name: Pylint duplicate-code
        run: uv run pylint --disable=all --enable=duplicate-code hephaistos

      - name: Pytest
        run: uv run pytest

      - name: Inject release privacy and diagnostics config
        env:
          HEPHAISTOS_POSTHOG_HOST: ${{ secrets.HEPHAISTOS_POSTHOG_HOST }}
          HEPHAISTOS_POSTHOG_PROJECT_TOKEN: ${{ secrets.HEPHAISTOS_POSTHOG_PROJECT_TOKEN }}
          HEPHAISTOS_SENTRY_DSN: ${{ secrets.HEPHAISTOS_SENTRY_DSN }}
          HEPHAISTOS_RELEASE_CHANNEL: pypi
          HEPHAISTOS_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          def literal(value: str) -> str:
              stripped = value.strip()
              return json.dumps(stripped) if stripped else "None"

          target = Path("hephaistos/privacy/release.py")
          target.write_text(
              "\n".join(
                  [
                      '"""Release-time privacy and diagnostics configuration."""',
                      "",
                      "from __future__ import annotations",
                      "",
                      f"POSTHOG_HOST: str | None = {literal(os.environ.get('HEPHAISTOS_POSTHOG_HOST', ''))}",
                      (
                          "POSTHOG_PROJECT_TOKEN: str | None = "
                          f"{literal(os.environ.get('HEPHAISTOS_POSTHOG_PROJECT_TOKEN', ''))}"
                      ),
                      f"SENTRY_DSN: str | None = {literal(os.environ.get('HEPHAISTOS_SENTRY_DSN', ''))}",
                      f"RELEASE_CHANNEL: str | None = {literal(os.environ.get('HEPHAISTOS_RELEASE_CHANNEL', ''))}",
                      f"RELEASE_VERSION: str | None = {literal(os.environ.get('HEPHAISTOS_RELEASE_VERSION', ''))}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Generate release notes
        id: notes
        env:
          NOTES_PATH: /tmp/release-notes.md
          REPO: ${{ github.repository }}
        run: |
          TAG="$RELEASE_TAG"
          PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          {
            echo "## What changed"
            echo ""
            git log "${RANGE}" --pretty=format:"- %s (%h)" --no-merges | head -50
            echo ""
            echo ""
            echo "## Full diff"
            echo ""
            echo "https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          } > "$NOTES_PATH"
          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          TAG="$RELEASE_TAG"
          gh release create "${TAG}" \
            dist/* \
            --title "${TAG}" \
            --notes-file "${RELEASE_NOTES_PATH}"

      - name: Notify release
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No webhook URL configured, skipping notification"
            exit 0
          fi
          TAG="$RELEASE_TAG"
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"version\":\"${TAG}\",\"commit\":\"${GITHUB_SHA}\",\"environment\":\"pypi\",\"repository\":\"${GITHUB_REPOSITORY}\",\"ref\":\"${TAG}\",\"trigger\":\"release\"}" \
            "${DEPLOY_WEBHOOK_URL}" || true
