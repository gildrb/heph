name: PR Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --group dev

      - name: Ruff lint check
        run: |
          mkdir -p review-artifacts
          if uv run ruff check . > /tmp/ruff-output.txt 2>&1; then
            : > review-artifacts/ruff-output.txt
          else
            cat /tmp/ruff-output.txt > review-artifacts/ruff-output.txt
          fi

      - name: Ruff format check
        run: |
          if uv run ruff format --check . > /tmp/format-output.txt 2>&1; then
            : > review-artifacts/format-output.txt
          else
            cat /tmp/format-output.txt > review-artifacts/format-output.txt
          fi

      - name: Upload review outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-review-output
          path: review-artifacts/

  review:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download review outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-review-output
          path: review-artifacts

      - name: Build and post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Automated Review"
            echo ""

            if [ -s review-artifacts/ruff-output.txt ]; then
              echo "### Ruff Lint Findings"
              echo '```'
              cat review-artifacts/ruff-output.txt
              echo '```'
              echo ""
            else
              echo "- Ruff lint: **passed**"
              echo ""
            fi

            if [ -s review-artifacts/format-output.txt ]; then
              echo "### Ruff Format Findings"
              echo '```'
              cat review-artifacts/format-output.txt
              echo '```'
              echo ""
            else
              echo "- Ruff format: **passed**"
              echo ""
            fi

            echo "---"
            echo ""
            DIFF=$(gh pr diff "$PR_NUMBER" --stat 2>/dev/null || echo "unavailable")
            echo "### Diff Stats"
            echo '```'
            echo "$DIFF"
            echo '```'
          } > /tmp/review-comment.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/review-comment.md
