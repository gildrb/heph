name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ruff check
        run: |
          start=$(date +%s%N)
          uv run ruff check .
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint ruff-check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Repo policy check
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.check_repo_policies
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint repo-policies | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ruff format check
        run: |
          start=$(date +%s%N)
          uv run ruff format --check .
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint ruff-format | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| docs-sync sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Docs sync check
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.sync_docs --check
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| docs-sync check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| typecheck sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ty
        run: |
          start=$(date +%s%N)
          uv run ty check
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| typecheck ty | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit
        run: |
          start=$(date +%s%N)
          uv run bandit -r hephaion -c pyproject.toml
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security bandit | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dead-code sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Vulture
        run: |
          start=$(date +%s%N)
          uv run vulture hephaion tests vulture-whitelist.py
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dead-code vulture | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| duplicate-code sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Pylint duplicate-code
        run: |
          start=$(date +%s%N)
          uv run pylint --disable=all --enable=duplicate-code hephaion
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| duplicate-code pylint | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| architecture sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Import-linter
        run: |
          start=$(date +%s%N)
          uv run lint-imports
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| architecture lint-imports | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| test sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Pytest
        run: |
          mkdir -p .artifacts
          start=$(date +%s%N)
          uv run pytest --junitxml=.artifacts/pytest-junit.xml
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| test pytest | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: .artifacts/pytest-junit.xml

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| benchmark sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Academic RAG benchmark suite
        run: |
          mkdir -p .artifacts
          if [ ! -f benchmarks/academic/manifest.json ]; then
            echo "| benchmark academic-suite | skipped: local private suite unavailable |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          start=$(date +%s%N)
          uv run python -m scripts.run_benchmark_suite \
            --json-report .artifacts/benchmark-suite.json
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| benchmark academic-suite | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path(".artifacts/benchmark-suite.json").read_text())
          print("")
          print("### Academic Benchmark")
          print("")
          print("| metric | value |")
          print("| --- | ---: |")
          print(f"| RAG hit rate | {report['rag']['hit_rate']:.3f} |")
          print(f"| RAG MRR | {report['rag']['mean_reciprocal_rank']:.3f} |")
          print(f"| RAG expected recall | {report['rag']['mean_expected_recall']:.3f} |")
          print(
              "| RAG forbidden-before-expected avoidance | "
              f"{report['rag']['forbidden_before_expected_avoidance']:.3f} |"
          )
          print(f"| Material role pass rate | {report['material_roles']['pass_rate']:.3f} |")
          print(f"| Index integrity pass rate | {report['index_integrity']['pass_rate']:.3f} |")
          print(
              "| Index required text rate | "
              f"{report['index_integrity']['required_text_rate']:.3f} |"
          )
          print(
              "| Index forbidden text rate | "
              f"{report['index_integrity']['forbidden_text_rate']:.3f} |"
          )
          print(
              "| Index corpus forbidden text rate | "
              f"{report['index_integrity']['corpus_forbidden_text_rate']:.3f} |"
          )
          print(
              "| Overview source coverage | "
              f"{report['document_understanding']['overview_source_coverage_rate']:.3f} |"
          )
          print(f"| Priority pass rate | {report['priority']['pass_rate']:.3f} |")
          print(
              "| Chat event stages | "
              f"reading={report['chat_events']['has_reading']} "
              f"evidence={report['chat_events']['has_evidence']} "
              f"writing={report['chat_events']['has_writing']} "
              f"complete={report['chat_events']['has_turn_complete']} "
              f"consistent={report['chat_events']['has_consistent_completion']} "
              f"metadata={report['chat_events']['has_evidence_metadata']} |"
          )
          print(f"| Chat event answer pass rate | {report['chat_events']['answer_pass_rate']:.3f} |")
          print(f"| Answer pass rate | {report['answers']['pass_rate']:.3f} |")
          print(f"| Answer required label rate | {report['answers']['required_label_rate']:.3f} |")
          print(f"| Study state pass rate | {report['study_state']['pass_rate']:.3f} |")
          print(
              "| Study state scheduling pass rate | "
              f"{report['study_state']['scheduling_pass_rate']:.3f} |"
          )
          PY
      - name: Upload benchmark report
        if: always() && hashFiles('.artifacts/benchmark-suite.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-suite-report
          path: .artifacts/benchmark-suite.json

  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| unused-deps sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Deptry
        run: |
          start=$(date +%s%N)
          uv run deptry hephaion
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| unused-deps deptry | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| complexity sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Radon complexity check
        run: |
          start=$(date +%s%N)
          uv run radon cc hephaion -a -nc --total-average
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| complexity radon | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| build sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: |
          start=$(date +%s%N)
          uv build
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| build uv-build | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  feature-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| feature-flags sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Check feature flags
        run: |
          start=$(date +%s%N)
          uv run python scripts/check_feature_flags.py --strict
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| feature-flags check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  security-pr-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security-pr-report sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit security scan
        continue-on-error: true
        id: bandit
        run: |
          mkdir -p .artifacts
          start=$(date +%s%N)
          FINDINGS=$(uv run bandit -r hephaion -f txt -ll -ii -s B101,B602,B310 2>&1 || true)
          echo "$FINDINGS" | tee .artifacts/security-findings.txt
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security bandit | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-pr-findings
          path: .artifacts/security-findings.txt

  security-pr-comment:
    needs: security-pr-report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download security findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-pr-findings
          path: .artifacts

      - name: Post security findings on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FINDINGS=$(cat .artifacts/security-findings.txt 2>/dev/null || true)
          if [ -n "$FINDINGS" ]; then
            {
              echo "## Security Scan Findings"
              echo ""
              echo '```'
              echo "$FINDINGS"
              echo '```'
            } > /tmp/security-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/security-comment.md
          else
            gh pr comment "$PR_NUMBER" --body "## Security Scan: No findings"
          fi

  tech-debt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Check TODO/FIXME issue links
        run: |
          start=$(date +%s%N)
          uv run python scripts/check_tech_debt.py --strict --report
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| tech-debt check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  agents-md-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Validate AGENTS.md commands
        run: |
          start=$(date +%s%N)
          uv run python scripts/validate_agents_md.py --strict
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| agents-md-validation check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  agent-detection:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Fetch PR commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch origin "pull/${PR_NUMBER}/head:pr-head" main
      - name: Detect agent co-authorship
        id: detect
        continue-on-error: true
        run: |
          mkdir -p .artifacts
          OUTPUT=$(uv run python scripts/detect_co_author.py --pr --base origin/main --head pr-head 2>&1 || true)
          echo "$OUTPUT" | tee .artifacts/agent-detection.txt

      - name: Upload agent detection result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-detection
          path: .artifacts/agent-detection.txt

  agent-detection-comment:
    needs: agent-detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download agent detection result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-detection
          path: .artifacts

      - name: Post agent attribution comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          OUTPUT=$(cat .artifacts/agent-detection.txt 2>/dev/null || true)
          if echo "$OUTPUT" | grep -q "Agent-authored"; then
            gh pr comment "$PR_NUMBER" --body "## Agent Attribution
          $OUTPUT"
          fi

  label-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/sync_labels.py

  metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-results
          path: .artifacts
      - name: Record build and test metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/record_metrics.py --junit-xml .artifacts/pytest-junit.xml
