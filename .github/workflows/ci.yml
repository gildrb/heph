name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ruff check
        run: |
          start=$(date +%s%N)
          uv run ruff check .
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint ruff-check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Repo policy check
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.check_repo_policies
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint repo-policies | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ruff format check
        run: |
          start=$(date +%s%N)
          uv run ruff format --check .
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint ruff-format | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| docs-sync sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Docs sync check
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.sync_docs --check
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| docs-sync check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| typecheck sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ty
        run: |
          start=$(date +%s%N)
          uv run ty check
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| typecheck ty | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit
        run: |
          start=$(date +%s%N)
          uv run bandit -r packages/ai/src packages/extensions/src packages/heph/src packages/hephaion/src packages/interfaces/src -c pyproject.toml
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security bandit | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  dependency-supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEPH_ALLOW_LOCKFILE_CHANGE: ${{ vars.HEPH_ALLOW_LOCKFILE_CHANGE }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dependency-supply-chain sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Lockfile review gate
        if: github.event_name == 'pull_request'
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.check_lockfile_change --git-diff "origin/${GITHUB_BASE_REF}...HEAD"
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dependency-supply-chain lockfile-review | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Lockfile freshness
        run: |
          start=$(date +%s%N)
          uv lock --check
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dependency-supply-chain lock-check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Direct dependency pinning
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.check_dependency_pinning
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dependency-supply-chain pinning | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Source-only sdist allowlist
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.check_dependency_sdist_allowlist
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dependency-supply-chain sdist-allowlist | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: No-build install check
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev --no-build --no-install-project --dry-run \
            || uv run python -m scripts.check_dependency_sdist_allowlist
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dependency-supply-chain no-build | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Dependency vulnerability audit
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.check_dependency_vulnerability_audit
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dependency-supply-chain uv-audit | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dead-code sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Vulture
        run: |
          start=$(date +%s%N)
          uv run vulture packages/ai/src packages/extensions/src packages/heph/src packages/hephaion/src packages/interfaces/src packages/ai/test packages/extensions/test packages/heph/test packages/hephaion/test packages/interfaces/test vulture-whitelist.py
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dead-code vulture | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| duplicate-code sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Pylint duplicate-code
        run: |
          start=$(date +%s%N)
          uv run pylint --disable=all --enable=duplicate-code packages/ai/src packages/extensions/src packages/heph/src packages/hephaion/src packages/interfaces/src
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| duplicate-code pylint | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| architecture sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Import-linter
        run: |
          start=$(date +%s%N)
          uv run lint-imports
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| architecture lint-imports | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| test sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Pytest
        run: |
          mkdir -p .artifacts
          start=$(date +%s%N)
          uv run pytest --junitxml=.artifacts/pytest-junit.xml
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| test pytest | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: .artifacts/pytest-junit.xml

  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| unused-deps sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Deptry
        run: |
          start=$(date +%s%N)
          uv run deptry packages/ai/src --config packages/ai/pyproject.toml
          uv run deptry packages/extensions/src --config packages/extensions/pyproject.toml
          uv run deptry packages/heph/src --config packages/heph/pyproject.toml
          uv run deptry packages/hephaion/src --config packages/hephaion/pyproject.toml
          uv run deptry packages/interfaces/src --config packages/interfaces/pyproject.toml
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| unused-deps deptry | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| complexity sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Radon complexity check
        run: |
          start=$(date +%s%N)
          uv run radon cc packages/ai/src packages/extensions/src packages/heph/src packages/hephaion/src packages/interfaces/src -a -nc --total-average
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| complexity radon | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| build sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: |
          start=$(date +%s%N)
          uv build --all-packages --build-constraints build-constraints.txt --require-hashes --no-sources
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| build uv-build | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Release stress test
        run: |
          start=$(date +%s%N)
          uv run python -m scripts.release_stress_test
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| build release-stress | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  feature-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| feature-flags sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Check feature flags
        run: |
          start=$(date +%s%N)
          uv run python scripts/check_feature_flags.py --strict
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| feature-flags check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  security-pr-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --frozen --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security-pr-report sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit security scan
        continue-on-error: true
        id: bandit
        run: |
          mkdir -p .artifacts
          start=$(date +%s%N)
          FINDINGS=$(uv run bandit -r packages/ai/src packages/extensions/src packages/heph/src packages/hephaion/src packages/interfaces/src -f txt -ll -ii -s B101,B602,B310 2>&1 || true)
          echo "$FINDINGS" | tee .artifacts/security-findings.txt
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security bandit | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-pr-findings
          path: .artifacts/security-findings.txt

  security-pr-comment:
    needs: security-pr-report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download security findings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-pr-findings
          path: .artifacts

      - name: Post security findings on PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FINDINGS=$(cat .artifacts/security-findings.txt 2>/dev/null || true)
          if [ -n "$FINDINGS" ]; then
            {
              echo "## Security Scan Findings"
              echo ""
              echo '```'
              echo "$FINDINGS"
              echo '```'
            } > /tmp/security-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/security-comment.md
          else
            gh pr comment "$PR_NUMBER" --body "## Security Scan: No findings"
          fi

  tech-debt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Check TODO/FIXME issue links
        run: |
          start=$(date +%s%N)
          uv run python scripts/check_tech_debt.py --strict --report
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| tech-debt check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  agents-md-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Validate AGENTS.md commands
        run: |
          start=$(date +%s%N)
          uv run python scripts/validate_agents_md.py --strict
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| agents-md-validation check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  label-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/sync_labels.py

  metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --frozen --group dev
      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-results
          path: .artifacts
      - name: Record build and test metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/record_metrics.py --junit-xml .artifacts/pytest-junit.xml
