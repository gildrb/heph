name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ruff check
        run: |
          start=$(date +%s%N)
          uv run ruff check .
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint ruff-check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Ruff format check
        run: |
          start=$(date +%s%N)
          uv run ruff format --check .
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| lint ruff-format | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| typecheck sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Basedpyright
        run: |
          start=$(date +%s%N)
          uv run basedpyright
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| typecheck basedpyright | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit
        run: |
          start=$(date +%s%N)
          uv run bandit -r hephaistos -c pyproject.toml
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security bandit | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dead-code sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Vulture
        run: |
          start=$(date +%s%N)
          uv run vulture hephaistos tests vulture-whitelist.py
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| dead-code vulture | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| duplicate-code sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Pylint duplicate-code
        run: |
          start=$(date +%s%N)
          uv run pylint --disable=all --enable=duplicate-code hephaistos
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| duplicate-code pylint | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| architecture sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Import-linter
        run: |
          start=$(date +%s%N)
          uv run lint-imports
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| architecture lint-imports | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| test sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Pytest
        run: |
          mkdir -p .artifacts
          start=$(date +%s%N)
          uv run pytest --junitxml=.artifacts/pytest-junit.xml
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| test pytest | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .artifacts/pytest-junit.xml

  unused-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| unused-deps sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Deptry
        run: |
          start=$(date +%s%N)
          uv run deptry hephaistos
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| unused-deps deptry | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| complexity sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Radon complexity check
        run: |
          start=$(date +%s%N)
          uv run radon cc hephaistos -a -nc --total-average
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| complexity radon | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| build sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: |
          start=$(date +%s%N)
          uv build
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| build uv-build | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  feature-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| feature-flags sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Check feature flags
        run: |
          start=$(date +%s%N)
          uv run python scripts/check_feature_flags.py --strict
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| feature-flags check | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: |
          start=$(date +%s%N)
          uv sync --group dev
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security sync | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"
      - name: Bandit security scan
        continue-on-error: true
        run: |
          start=$(date +%s%N)
          uv run bandit -r hephaistos -f txt -ll -ii -s B101,B602,B310
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "| security bandit | ${ms}ms |" >> "$GITHUB_STEP_SUMMARY"

      - name: Post security findings on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FINDINGS=$(uv run bandit -r hephaistos -f txt -ll -ii -s B101,B602,B310 2>&1 || true)
          if [ -n "$FINDINGS" ]; then
            {
              echo "## Security Scan Findings"
              echo ""
              echo '```'
              echo "$FINDINGS"
              echo '```'
            } > /tmp/security-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/security-comment.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "## Security Scan: No findings"
          fi

  metrics:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .artifacts
      - name: Record build and test metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/record_metrics.py --junit-xml .artifacts/pytest-junit.xml
