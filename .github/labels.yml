# GitHub Issue Labels
# Sync with: python scripts/sync_labels.py
# Colors use hex without the leading '#'

- name: "area/cli"
  color: "0075ca"
  description: "CLI and shell interface"

- name: "area/chat"
  color: "0075ca"
  description: "Chat engine, session, and orchestrator"

- name: "area/providers"
  color: "0075ca"
  description: "LLM provider integrations and auth"

- name: "area/armory"
  color: "0075ca"
  description: "Knowledge base management"

- name: "area/observability"
  color: "0075ca"
  description: "Logging, profiling, traces, and diagnostics"

- name: "area/infra"
  color: "0075ca"
  description: "CI/CD, build, and deployment"

- name: "area/docs"
  color: "0075ca"
  description: "Documentation and runbooks"

- name: "type/bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "type/feature"
  color: "0e8a16"
  description: "New feature or request"

- name: "type/refactor"
  color: "c5def5"
  description: "Code restructuring without behavior change"

- name: "type/docs"
  color: "bfdadc"
  description: "Documentation improvement"

- name: "type/test"
  color: "e99695"
  description: "Test coverage or quality improvement"

- name: "type/chore"
  color: "fef2c0"
  description: "Maintenance, dependencies, tooling"

- name: "priority/critical"
  color: "b60205"
  description: "Blocker — must fix immediately"

- name: "priority/high"
  color: "d93f0b"
  description: "Important — fix soon"

- name: "priority/medium"
  color: "fbca04"
  description: "Normal priority"

- name: "priority/low"
  color: "0e8a16"
  description: "Nice to have"

- name: "status/blocked"
  color: "b60205"
  description: "Blocked by another issue or PR"

- name: "status/in-progress"
  color: "1d76db"
  description: "Currently being worked on"

- name: "status/needs-review"
  color: "fbca04"
  description: "Awaiting code review"

- name: "status/needs-triage"
  color: "e99695"
  description: "Awaiting initial assessment"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "tech-debt"
  color: "cfd3d7"
  description: "Technical debt — TODO/FIXME tracking"

- name: "agent-authored"
  color: "bfd4f2"
  description: "Authored or co-authored by an AI agent"

- name: "security"
  color: "d73a4a"
  description: "Security-related issue or fix"

- name: "breaking-change"
  color: "b60205"
  description: "Introduces a breaking API change"
